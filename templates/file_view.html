{% extends "base.html" %}
{% block title %}{{ name }}{% endblock %}

{% block content %}
<h1>{{ name }}</h1>
<a href="javascript:history.back()">Back</a>

<div class="content-container" style="margin-top: 20px;">
    {% if file_type == "pdf" %}
        <iframe 
            src="http://www.solarcubed.org/dev-content-ea/{{ data.file_name }}" 
            style="min-height: 750px; width: 100%; border: none;">
        </iframe>   
    {% else if file_type == "video" %}
        <video controls>
            <source src="{{ path }}" type="video/mp4">
        </video>
    {% else if file_type == "audio" %}
        <audio controls>
            <source src="{{ path }}" type="audio/mpeg">
        </audio>
    {% else if file_type == "html" %}
        <iframe src="{{ path }}" width="100%" height="800px"></iframe>

    {% endif %}
</div>
{% endblock %}
